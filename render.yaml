services:
  - type: web
    name: alliance-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn alliance_platform.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: REDIS_URL
        fromService:
          type: redis
          name: alliance-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

  - type: worker
    name: alliance-worker
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "celery -A alliance_platform worker -l info"
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: alliance-redis
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

  - type: redis
    name: alliance-redis
    ipAllowList: []
    plan: free
