services:
  - type: web
    name: alliance-backend
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn alliance_platform.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
